# @author yxpil
appId: com.toapi.desktop
productName: ToAPI
copyright: Copyright © 2026 ToAPI

directories:
  output: release
  buildResources: build

# 复用已下载的 Electron 解包目录，避免打包阶段再次联网拉取
electronDist: node_modules/electron/dist

files:
  - dist/**
  - dist-electron/**
  - electron/assets/**
  - package.json

asar: true
compression: normal
# 无原生依赖需要按 Electron ABI 重编译；关掉可避免 builder 尝试重建可选原生包
npmRebuild: false

win:
  target:
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  # 图标需为正方形 PNG/ICO，LOGO.png 目前是 576×574，先沿用默认图标

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  artifactName: ${productName}-Setup-${version}-win-${arch}.${ext}

# Linux 主流发行版（14 号文档 §3.1 P0）：AppImage 免依赖、deb/rpm 覆盖 UOS/麒麟与 Fedora/RHEL 系
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  category: Development
  # 桌面项由 builder 按 productName/description 自动生成；electron-builder 26 不接受内联 desktop 配置

# macOS：无开发者证书 → 不出公证包，产物为未签名 dmg/zip，首次启动需右键打开绕过 Gatekeeper
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
